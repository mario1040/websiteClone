name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate JavaScript and project metadata
        run: |
          node --check script.js
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
      - name: Validate internal navigation targets
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const ids = [...html.matchAll(/\\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicates = ids.filter((id, index) => ids.indexOf(id) !== index);
          const missing = [...html.matchAll(/\\bhref=["']#([^"']+)["']/g)]
            .map(match => match[1]).filter(id => !ids.includes(id));
          if (duplicates.length || missing.length) {
            console.error({ duplicates, missing });
            process.exit(1);
          }
          console.log('Internal navigation targets validated.');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
